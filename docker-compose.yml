---
services:
  web:
    build:
      context: ./search_objects/
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      HF_HOME: /root/.cache/huggingface
      FLASK_APP: main.py
      S3_ENDPOINT_URL: http://silo:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    volumes:
      - ./search_objects/:/app
      - hf_cache:/root/.cache/huggingface
    ports:
      - 5555:5000
    networks:
      - so_net

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - so_net

  silo:
    image: pgsty/silo:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
    volumes:
      - silo_data:/data
    ports:
      - 9000:9000 # S3 API (anonymous read-only on the bucket)
      - 127.0.0.1:9001:9001 # admin console, local only
    networks:
      - so_net

  silo-init:
    image: pgsty/silo:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      S3_ROOT_USER: ${S3_ROOT_USER}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./silo/init.sh:/init.sh:ro
    depends_on:
      - silo
    networks:
      - so_net

volumes:
  db_data:
  silo_data:
  hf_cache:

networks:
  so_net:
    driver: bridge
